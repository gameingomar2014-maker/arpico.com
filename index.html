      <input id="upTitle" placeholder="اكتب هنا..."></div>
    ${desc ? `<div class="field"><label>وصف (اختياري)</label><input id="upDesc" placeholder="تفاصيل..."></div>` : ''}
    <p class="hint">الملف هيتخزن محليًا على جهازك (IndexedDB) ويفضل موجود بعد إغلاق المتصفح.</p>
    <div class="macts">
      <button class="btn" id="upCancel">إلغاء</button>
      <button class="btn primary" id="upGo"><i data-lucide="upload"></i> نشر</button>
    </div>`);
  $('#upCancel').onclick = closeModal;
  $('#upGo').onclick = () => {
    const f = $('#upFile').files[0];
    if (!f) { toast('اختار ملف الأول', 'shield'); return; }
    const caption = $('#upTitle').value.trim();
    const d = $('#upDesc') ? $('#upDesc').value.trim() : '';
    closeModal();
    cb(f, caption, d);
  };
}

/* ============ البروفايل ============ */
function renderProfile(d){
  const email = (d.email || '').toLowerCase();
  const u = users.find(x => x.email === email);
  if (!u) { viewport.innerHTML = `<div class="site404">${bean()}<h3>الحساب غير موجود</h3><p style="font-size:13px">ممكن يكون اتمسح.</p></div>`; return; }
  const m = me();
  const isMe = m && m.email === email;
  const posts = instaPosts.filter(p => p.authorEmail === email);
  const vids = [
    ...tkPosts.filter(p => p.authorEmail === email).map(p => ({...p, kind:'tk'})),
    ...ytPosts.filter(p => p.authorEmail === email).map(p => ({...p, kind:'yt'})),
  ];
  const mysites = sites.filter(s => s.authorEmail === email);
  const fCount = (friends[email] || []).length;

  let fBtn = '';
  if (m && !isMe) {
    const req = reqBetween(m.email, email);
    if (areFriends(m.email, email)) fBtn = `<button class="btn" data-act="removeFriend" data-peer="${esc(email)}"><i data-lucide="user-check"></i> صديق — إزالة</button>`;
    else if (req && req.from === m.email) fBtn = `<button class="btn" disabled style="opacity:.55;cursor:default"><i data-lucide="clock"></i> طلبك مرسل</button>`;
    else if (req) fBtn = `<button class="btn primary" data-act="acceptReq" data-peer="${esc(email)}"><i data-lucide="user-plus"></i> موافقة على طلبه</button>`;
    else fBtn = `<button class="btn primary" data-act="addFriend" data-peer="${esc(email)}"><i data-lucide="user-plus"></i> إضافة صديق</button>`;
  }

  viewport.innerHTML = `<div class="prof page"><div class="prof-wrap">
    <div class="prof-card">
      ${avatarHTML(u.name, 88)}
      <div class="prof-info">
        <div class="n">${esc(u.name)}</div>
        <div class="e">${esc(u.email)}</div>
        <div class="j">عضو منذ ${fmtDate(u.joined)}</div>
        <div class="prof-stats">
          <span><b>${arNum(posts.length)}</b> منشور</span>
          <span><b>${arNum(vids.length)}</b> فيديو</span>
          <span><b>${arNum(fCount)}</b> صديق</span>
          <span><b>${arNum(mysites.length)}</b> موقع</span>
        </div>
      </div>
      <div class="prof-acts">
        ${isMe ? `<button class="btn" id="pEdit"><i data-lucide="settings"></i> إعداداتي</button>` : `
          ${fBtn}
          <button class="btn" data-act="chatWith" data-peer="${esc(email)}"><i data-lucide="message-circle"></i> رسالة</button>
          <button class="iconbtn" data-act="callVideo" data-peer="${esc(email)}" title="مكالمة فيديو" style="width:42px;height:42px"><i data-lucide="video"></i></button>
          <button class="iconbtn" data-act="callAudio" data-peer="${esc(email)}" title="مكالمة صوتية" style="width:42px;height:42px"><i data-lucide="phone"></i></button>`}
      </div>
    </div>
    <div class="ptabs">
      <button class="chip ${profUI.tab==='posts'?'on':''}" data-pt="posts">منشوراته (${arNum(posts.length)})</button>
      <button class="chip ${profUI.tab==='vids'?'on':''}" data-pt="vids">فيديوهاته (${arNum(vids.length)})</button>
      <button class="chip ${profUI.tab==='sites'?'on':''}" data-pt="sites">مواقعه (${arNum(mysites.length)})</button>
    </div>
    <div id="profBody"></div>
  </div></div>`;

  const body = $('#profBody');
  const t = profUI.tab;
  if (t === 'posts') {
    body.innerHTML = posts.length ? `<div class="pgrid">${posts.map(p => `
      <div class="ptile ${p.type === 'video' ? 'vid' : ''}" data-go="insta">
        ${p.type === 'video' ? `<video data-media="${p.mediaId}" muted preload="metadata"></video>` : `<img data-media="${p.mediaId}" alt="">`}
      </div>`).join('')}</div>`
    : `<div class="prof-empty">مفيش منشورات لسه</div>`;
  } else if (t === 'vids') {
    body.innerHTML = vids.length ? `<div class="pgrid">${vids.map(p => `
      <div class="ptile vid" data-kind="${p.kind}" data-id="${p.id}">
        <video data-media="${p.mediaId}" muted preload="metadata"></video>
      </div>`).join('')}</div>`
    : `<div class="prof-empty">مفيش فيديوهات لسه</div>`;
  } else {
    body.innerHTML = mysites.length ? mysites.map(s => `<div class="srowmini" data-site="${s.id}">
      ${letterDot(s.slug, 'avatar')}
      <div style="flex:1;min-width:0"><div class="n">${esc(s.name)}</div><div class="u">${esc(s.slug)}.arpico</div></div>
      <span class="rtag">${arNum(s.views)} زيارة</span>
    </div>`).join('') : `<div class="prof-empty">مفيش مواقع منشورة</div>`;
  }
  icons(); hydrateMedia(body);

  viewport.querySelectorAll('.ptabs .chip').forEach(c => c.onclick = () => { profUI.tab = c.dataset.pt; renderProfile(d); icons(); });
  body.querySelectorAll('[data-go="insta"]').forEach(x => x.onclick = () => navigate('insta'));
  body.querySelectorAll('[data-kind="tk"]').forEach(x => x.onclick = () => navigate('tiktok'));
  body.querySelectorAll('[data-kind="yt"]').forEach(x => x.onclick = () => navigate('yt'));
  body.querySelectorAll('[data-site]').forEach(x => x.onclick = () => navigate('site', {siteId:x.dataset.site}));

  const pe = $('#pEdit');
  if (pe) pe.onclick = () => navigate('settings');
}

/* ============ نظام الأحداث الموحد لكل أزرار الصداقة والدردشة والمكالمات ============ */
// زر واحد يتحكم في كل حاجة — مستحيل زرار يضيع من الربط تاني
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const peer = (el.dataset.peer || '').trim().toLowerCase();
  const u = me();
  const rerender = () => { renderContent(); icons(); };

  switch (act) {
    case 'addFriend':
      sendFriendReq(peer);
      rerender();
      break;
    case 'acceptReq': {
      const rid = el.dataset.req
        || ((friendReqs.find(r => r.status === 'pending' && ((r.from === peer && r.to === u?.email) || (r.to === peer && r.from === u?.email))) || {}).id);
      if (rid) acceptReq(rid);
      rerender();
      break;
    }
    case 'rejectReq': {
      const rid = el.dataset.req
        || ((friendReqs.find(r => r.status === 'pending' && r.to === u?.email && r.from === peer) || {}).id);
      if (rid) rejectReq(rid);
      rerender();
      break;
    }
    case 'removeFriend':
      if (!u || !peer) break;
      confirmBox(`هتشيل ${esc(displayNameFor(peer))} من أصدقائك. متأكد؟`, () => {
        setFriends(u.email, peer, false);
        toast('تمت الإزالة', 'user-x');
        rerender();
      });
      break;
    case 'chatWith': {
      if (!users.some(x => x.email === peer)) { toast('الحساب ده مش موجود', 'shield', true); break; }
      chatUI.peer = peer; chatUI.foundList = [];
      if (isNarrow()) { openChatModal(peer); }
      else if (curPage() && curPage().page === 'chat') { rerender(); }
      else navigate('chat');
      break;
    }
    case 'callVideo': openCall(peer, true); break;
    case 'callAudio': openCall(peer, false); break;
  }
});

/* ============ قائمة الحساب ============ */
function toggleProfileMenu(){
  const menu = $('#profileMenu');
  if (menu.classList.contains('open')) { menu.classList.remove('open'); return; }
  const u = me(); const ub = unread(); const uc = unreadChats() + incomingReqs().length;
  menu.innerHTML = u ? `
    <div class="menu-h"><span data-mi="profile" style="cursor:pointer;display:flex;align-items:center;gap:11px;width:100%">${avatarHTML(u.name, 38)}<div><div class="n">${esc(u.name)}</div><div class="e">${esc(u.email)}</div></div></span></div>
    <button class="mi" data-a="profile"><i data-lucide="user"></i> بروفايلي</button>
    <button class="mi" data-a="mail"><i data-lucide="mail"></i> أرابكوا ميل ${ub ? `<span class="bdg">${arNum(ub)}</span>` : ''}</button>
    <button class="mi" data-a="chat"><i data-lucide="message-circle"></i> الدردشة ${uc ? `<span class="bdg">${arNum(uc)}</span>` : ''}</button>
    <button class="mi" data-a="insta"><i data-lucide="image"></i> انستا</button>
    <button class="mi" data-a="tiktok"><i data-lucide="music-2"></i> تيك توك</button>
    <button class="mi" data-a="yt"><i data-lucide="video"></i> يوتيوب أرابكوا</button>
    <button class="mi" data-a="network"><i data-lucide="globe"></i> شبكة أرابكوا</button>
    <button class="mi hl" data-a="publish"><i data-lucide="upload"></i> انشر موقعك</button>
    <div class="msep"></div>
    <button class="mi" data-a="settings"><i data-lucide="settings"></i> إعدادات الحساب</button>
    <button class="mi" data-a="logout"><i data-lucide="log-out"></i> تسجيل الخروج</button>` : `
    <div class="menu-h"><span class="avatar" style="width:38px;height:38px;background:var(--ink3)"><i data-lucide="user" style="width:17px;height:17px"></i></span>
      <div><div class="n">زائر</div><div class="e">ما تسجلتش دخول</div></div></div>
    <button class="mi" data-a="login"><i data-lucide="user"></i> تسجيل الدخول</button>
    <button class="mi hl" data-a="signup"><i data-lucide="sparkles"></i> إنشاء حساب @arpico.com</button>
    <div class="msep"></div>
    <button class="mi" data-a="network"><i data-lucide="globe"></i> شبكة أرابكوا</button>`;
  menu.classList.add('open'); icons();
  const pH = menu.querySelector('[data-mi="profile"]');
  if (pH) pH.onclick = () => { menu.classList.remove('open'); goProfile(u.email); };
  menu.querySelectorAll('.mi').forEach(b => b.onclick = () => {
    menu.classList.remove('open');
    const a = b.dataset.a;
    if (a === 'logout') {
      session = null; DB.set('arp_session', null);
      pendingNav = null; mailUI = {folder:'inbox', open:null}; chatUI = {peer:null, q:'', foundList:[]};
      toast('تم تسجيل الخروج', 'log-out'); renderAll(); return navigate('ntp');
    }
    if (a === 'publish') return goPublishNew();
    if (a === 'profile') return goProfile(session);
    if (a === 'login' || a === 'signup') { authMode = a; return navigate('login'); }
    navigate(a);
  });
}
function closeMenus(){ $('#profileMenu').classList.remove('open'); $('#obSugg').classList.remove('open'); }

function setTheme(t){
  theme = t; DB.set('arp_theme', t);
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').innerHTML = `<i data-lucide="${t === 'dark' ? 'sun' : 'moon'}"></i>`; icons();
}

/* ============ ربط الأدوات ============ */
 $('#tabs').addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) { e.stopPropagation(); return closeTab(+c.dataset.close); }
  const t = e.target.closest('.tab');
  if (t) activateTab(+t.dataset.id);
});
 $('#tabs').addEventListener('auxclick', e => {
  if (e.button !== 1) return;
  const t = e.target.closest('.tab');
  if (t) closeTab(+t.dataset.id);
});
 $('#newTabBtn').onclick = () => newTab('ntp');
 $('#backBtn').onclick = () => { const t = cur(); if (t && t.hi > 0) { t.hi--; renderAll(); } };
 $('#fwdBtn').onclick  = () => { const t = cur(); if (t && t.hi < t.hist.length - 1) { t.hi++; renderAll(); } };
 $('#homeBtn').onclick = () => navigate('ntp');
 $('#reloadBtn').onclick = () => {
  const b = $('#reloadBtn'); b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 550);
  renderContent(); icons();
};
 $('#starBtn').onclick = () => {
  const p = curPage(); if (!p) return;
  const i = bookmarks.findIndex(b => b.url === p.url);
  if (i >= 0) { bookmarks.splice(i, 1); toast('أُزيلت من العلامات المرجعية', 'bookmark'); }
  else {
    bookmarks.unshift({url:p.url, title:p.title, page:p.page, data:JSON.parse(JSON.stringify(p.data || {}))});
    toast('أُضيفت للعلامات المرجعية', 'bookmark');
  }
  DB.set('arp_bookmarks', bookmarks); renderAll();
};
 $('#bookmarksbar').addEventListener('click', e => {
  const b = e.target.closest('.bm'); if (!b) return;
  const bm = bookmarks[+b.dataset.i]; navigate(bm.page, bm.data || {});
});
 $('#bookmarksbar').addEventListener('contextmenu', e => {
  const b = e.target.closest('.bm'); if (!b) return;
  e.preventDefault();
  const bm = bookmarks[+b.dataset.i];
  confirmBox(`تحذف "${esc(bm.title)}" من العلامات المرجعية؟`, () => {
    bookmarks.splice(+b.dataset.i, 1); DB.set('arp_bookmarks', bookmarks);
    toast('أُزيلت العلامة', 'bookmark'); renderAll();
  });
});
const omni = $('#omnibox');
omni.addEventListener('keydown', e => { if (e.key === 'Enter') { omniboxSubmit(omni.value); $('#obSugg').classList.remove('open'); omni.blur(); } });
omni.addEventListener('focus', () => omni.select());
attachSugg(omni, $('#obSugg'));
 $('#micBtn').onclick = () => startVoice($('#micBtn'), t => { omni.value = t; omniboxSubmit(t); });
 $('#themeBtn').onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');
 $('#profileBtn').onclick = e => { e.stopPropagation(); toggleProfileMenu(); };
document.addEventListener('click', e => {
  if (!e.target.closest('#profileMenu') && !e.target.closest('#profileBtn')) $('#profileMenu').classList.remove('open');
});

let lastNarrow = isNarrow();
window.addEventListener('resize', debounce(() => {
  if (isNarrow() !== lastNarrow) { lastNarrow = isNarrow(); renderContent(); icons(); }
}, 200));

document.addEventListener('keydown', e => {
  if (!e.key) return;
  if (e.key === 'Escape') { closeMenus(); closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (e.key === '/' && !typing) { e.preventDefault(); omni.focus(); omni.select(); return; }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') { e.preventDefault(); setTheme(theme === 'dark' ? 'light' : 'dark'); return; }
  if (e.ctrlKey && !e.shiftKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !typing && tabs.length > 1) {
    e.preventDefault();
    const i = tabs.findIndex(x => x.id === activeTab);
    const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    activateTab(tabs[n].id);
  }
});

/* ============ انطلاق ============ */
idbOpen();
ensureIcons();
document.documentElement.setAttribute('data-theme', theme);
 $('#themeBtn').innerHTML = `<i data-lucide="${theme === 'dark' ? 'sun' : 'moon'}"></i>`;
if (!storageOk) {
  setTimeout(() => toast('تنبيه: التخزين الدائم غير متاح في وضع التصفح الحالي — الحسابات والبيانات هتتمسح عند إغلاق النافذة. افتح الملف في نافذة عادية مش تصفح خاص.', 'shield', true), 800);
}
newTab('ntp');
</script>
