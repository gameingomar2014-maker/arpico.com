<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أرابكوا — المتصفح العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Lalezar&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
window.ensureIcons = function(){
  if (typeof lucide !== 'undefined') return;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js';
  s.onload = function(){ try { lucide.createIcons(); } catch(e){} };
  document.head.appendChild(s);
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#B23A2E; --brand-deep:#8E2C22; --brand-soft:#F6E7E3;
  --ink:#241C16; --ink2:#6B5F55; --ink3:#9C8F82;
  --bg:#F1ECE5; --chrome:#E7E1D8; --panel:#FFFFFF; --panel2:#FBF9F6; --line:#E4DCD1;
  --ok:#2E6E5E; --dot:rgba(40,30,20,.05);
  --shadow:0 1px 2px rgba(40,30,20,.06),0 10px 30px rgba(40,30,20,.08);
}
[data-theme="dark"]{
  --brand:#D86A50; --brand-deep:#B23A2E; --brand-soft:#3A2622;
  --ink:#F0E8DC; --ink2:#B9AB9B; --ink3:#8B7D6F;
  --bg:#161210; --chrome:#211B16; --panel:#1D1712; --panel2:#241D17; --line:#383026;
  --ok:#5FB8A2; --dot:rgba(255,255,255,.045);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}
a{color:inherit}
img{background:var(--panel2)}
mark{background:var(--brand-soft);color:var(--brand);border-radius:3px;padding:0 2px}

#tabstrip{background:var(--chrome);display:flex;align-items:flex-end;padding:8px 12px 0;gap:4px;height:46px;flex-shrink:0}
#tabs{display:flex;align-items:flex-end;gap:4px;flex:1;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:11px 11px 0 0;min-width:110px;width:200px;flex:0 1 auto;color:var(--ink2);position:relative;transition:background .15s}
.tab:hover{background:rgba(128,110,90,.12)}
.tab.active{background:var(--panel);color:var(--ink);z-index:2}
.tab.active::before,.tab.active::after{content:'';position:absolute;bottom:0;width:11px;height:11px}
.tab.active::before{left:-11px;border-bottom-right-radius:11px;box-shadow:5px 0 0 0 var(--panel)}
.tab.active::after{right:-11px;border-bottom-left-radius:11px;box-shadow:-5px 0 0 0 var(--panel)}
.tab .tfav{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tab .tfav svg,.tab .tfav .bean{width:15px;height:15px}
.tab .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:500}
.tab .tclose{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.6}
.tab .tclose:hover{background:rgba(128,110,90,.2);opacity:1}
.tab .tclose svg{width:13px;height:13px}
#newTabBtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2);margin-bottom:4px;flex-shrink:0}
#newTabBtn:hover{background:rgba(128,110,90,.15)}
#newTabBtn svg{width:17px;height:17px}

#toolbar{background:var(--chrome);display:flex;align-items:center;gap:6px;padding:7px 12px;flex-shrink:0;position:relative}
.navbtns{display:flex;gap:2px}
.navbtns button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.navbtns button:hover:not(:disabled){background:rgba(128,110,90,.15);color:var(--ink)}
.navbtns button:disabled{opacity:.32;cursor:default}
.navbtns svg{width:17px;height:17px}
#reloadBtn.spin svg{animation:spin .5s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#omniboxWrap{flex:1;max-width:760px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;height:38px;display:flex;align-items:center;padding:0 6px 0 14px;gap:9px;position:relative;transition:border-color .15s,box-shadow .15s}
#omniboxWrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
#obIcon{display:flex;align-items:center;width:20px;justify-content:center;flex-shrink:0}
#obIcon svg,#obIcon .bean{width:15px;height:15px}
#omnibox{flex:1;border:0;outline:0;background:none;font-size:13.5px;direction:ltr;text-align:left;min-width:0}
.obbtn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
.obbtn:hover{background:rgba(128,110,90,.14);color:var(--ink)}
.obbtn svg{width:16px;height:16px}
#starBtn.filled svg{fill:var(--brand);color:var(--brand)}
.micbtn.listening,.listening{background:var(--brand)!important;color:#fff!important;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,46,.4)}50%{box-shadow:0 0 0 7px rgba(178,58,46,0)}}
.tb-right{display:flex;align-items:center;gap:4px}
#profileBtn{width:34px;height:34px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#profileBtn:hover{background:rgba(128,110,90,.15)}
#profileBtn svg{width:19px;height:19px;color:var(--ink2)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.fico{position:relative;display:flex;width:15px;height:15px;align-items:center;justify-content:center}
.fico svg{width:15px;height:15px}
.tb-dot{position:absolute;top:-3px;inset-inline-end:-4px;width:7px;height:7px;border-radius:50%;background:var(--brand);border:1.5px solid var(--panel)}

#bookmarksbar{background:var(--chrome);display:flex;align-items:center;gap:2px;padding:0 14px 8px;min-height:28px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#bookmarksbar::-webkit-scrollbar{display:none}
.bm{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;font-size:12px;color:var(--ink2);white-space:nowrap;max-width:190px}
.bm:hover{background:rgba(128,110,90,.15);color:var(--ink)}
.bm .bfav{width:15px;height:15px;display:flex;align-items:center;justify-content:center}
.bm .bfav svg,.bm .bfav .bean{width:12px;height:12px}
.bm span.t{overflow:hidden;text-overflow:ellipsis}
.bm-empty{font-size:11.5px;color:var(--ink3)}

#viewport{flex:1;background:var(--panel);position:relative;overflow:hidden;min-height:0}
.page{height:100%;overflow-y:auto}
.siteframe{width:100%;height:100%;border:0;background:#fff;display:block}
.bean{display:inline-block;flex-shrink:0;width:16px;height:16px}
.bean-xs{width:34px;height:34px}

.ntp{height:100%;overflow-y:auto;background:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px}
.ntp-inner{max-width:660px;margin:0 auto;padding:8vh 24px 60px;text-align:center}
.ntp-logo{display:flex;align-items:center;justify-content:center;gap:12px}
.ntp-logo .bean{width:44px;height:44px}
.ntp-logo h1{font-family:'Lalezar',cursive;font-size:54px;line-height:1;color:var(--ink)}
.ntp-sub{color:var(--ink2);font-size:14px;margin-top:10px}
.bigsearch{margin:32px auto 0;max-width:580px;background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;height:54px;display:flex;align-items:center;padding:0 8px 0 20px;gap:12px;box-shadow:var(--shadow);position:relative;transition:border-color .15s}
.bigsearch:focus-within{border-color:var(--brand)}
.bigsearch>svg{width:19px;height:19px;color:var(--ink3);flex-shrink:0}
.bigsearch input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.bigsearch .micbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
.bigsearch .micbtn:hover{background:var(--brand-soft);color:var(--brand)}
.bigsearch .micbtn svg{width:18px;height:18px}
.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:32px}
.schip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--ink2);background:var(--panel2);transition:all .15s;position:relative}
.schip:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.schip svg{width:16px;height:16px}
.schip.hl{border-color:var(--brand);color:var(--brand);font-weight:700}
.schip .bdg{background:var(--brand);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.favsec{margin-top:28px;text-align:start}
.favsec h3,.fresh-head h3{font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.favsec h3 svg,.fresh-head h3 svg{width:14px;height:14px}
.favrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.favbtn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12.5px;max-width:230px}
.favbtn:hover{border-color:var(--brand);color:var(--brand)}
.favbtn svg{width:15px;height:15px;color:var(--ink3);flex-shrink:0}
.favbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fresh{margin-top:32px;text-align:start}
.fresh-head{display:flex;align-items:center;justify-content:space-between}
.fresh-head h3{display:flex}
.fresh-head button{font-size:12px;color:var(--brand);font-weight:700}
.fresh-head button:hover{text-decoration:underline}
.fresh-row{display:flex;gap:12px;margin-top:12px;overflow-x:auto;padding-bottom:8px}
.fcard{min-width:200px;max-width:200px;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:start;background:var(--panel2);cursor:pointer;transition:all .15s}
.fcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.fcard .fname{font-weight:700;font-size:14px;margin-bottom:2px}
.fcard .furl{font-size:11px;color:var(--ok);direction:ltr;text-align:right}
.fcard .fdesc{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .fviews{font-size:11px;color:var(--ink3);margin-top:10px;display:flex;align-items:center;gap:5px}
.fcard .fviews svg{width:12px;height:12px}
.netcta{margin-top:32px;border:1.5px dashed var(--brand);border-radius:16px;padding:22px;background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;gap:10px}
.netcta p{font-size:13.5px;font-weight:700}
.netcta svg{width:22px;height:22px}

.serp{height:100%;overflow-y:auto}
.serp-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 0;z-index:5}
.serp-head-in{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 24px}
.serp-head .bean{width:30px;height:30px}
.serp-box{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;height:44px;display:flex;align-items:center;padding:0 8px 0 18px;gap:10px}
.serp-box:focus-within{border-color:var(--brand)}
.serp-box>svg{width:16px;height:16px;color:var(--ink3)}
.serp-box input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0}
.serp-box .micbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.serp-box .micbtn:hover{background:var(--brand-soft);color:var(--brand)}
.serp-box .micbtn svg{width:15px;height:15px}
.chips{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--panel2)}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on:hover{color:#fff}
.chip .n{opacity:.7;font-weight:500}
.serp-body{max-width:700px;margin:0 auto;padding:20px 24px 70px}
.serp-meta{font-size:12px;color:var(--ink3);margin-bottom:18px}
.serp-sec{font-size:12.5px;font-weight:700;color:var(--ink3);margin:22px 0 10px;display:flex;align-items:center;gap:7px}
.serp-sec:first-of-type{margin-top:6px}
.serp-sec svg{width:14px;height:14px}
.rrow{padding:13px 14px;border-radius:14px;cursor:pointer;margin:0 -14px;transition:background .12s}
.rrow:hover{background:var(--panel2)}
.rsite{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.rname{font-size:12.5px;color:var(--ink2)}
.rurl{font-size:11.5px;color:var(--ink3);direction:ltr}
.rtitle{font-size:17.5px;font-weight:600;color:var(--brand);line-height:1.5}
.rdesc{font-size:13px;color:var(--ink2);line-height:1.8;margin-top:4px}
.rtag{font-size:10.5px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-weight:700}
.rtag.g{background:transparent;border:1px solid var(--brand);margin-inline-start:6px}
.approw{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:10px;background:var(--panel2);transition:all .15s}
.approw:hover{border-color:var(--brand);transform:translateY(-1px)}
.appic{width:46px;height:46px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.appic svg{width:22px;height:22px}
.appinfo{flex:1;min-width:0}
.appinfo .t{font-weight:700;font-size:14.5px}
.appinfo .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.empty-results{text-align:center;padding:50px 20px}
.empty-results svg{width:42px;height:42px;color:var(--ink3)}
.empty-results h3{margin:14px 0 6px;font-size:17px}
.empty-results p{color:var(--ink2);font-size:13.5px;line-height:1.8}
.empty-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.filter-empty{font-size:13px;color:var(--ink3);padding:20px 0;text-align:center}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn svg{width:16px;height:16px}

.authwrap{height:100%;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--panel2);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:24px 24px}
.authcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--shadow);text-align:center}
.authcard h2{font-size:20px;margin-top:12px}
.authcard .sub{color:var(--ink2);font-size:13px;line-height:1.8;margin:8px 0 4px}
.authtabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;margin:20px 0}
.authtabs button{flex:1;padding:9px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.authtabs button.on{background:var(--brand);color:#fff}
.field{text-align:start;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--ink2)}
.field input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;font-size:14px;background:var(--panel2);outline:0;transition:border-color .15s}
.field input:focus{border-color:var(--brand)}
.pw{position:relative}
.pw input{padding-inline-end:42px}
.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.pw .eye:hover{color:var(--brand)}
.pw .eye svg{width:16px;height:16px}
.email-live{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;margin:-2px 0 14px;direction:ltr;flex-wrap:wrap}
.email-live .at{font-size:17px;font-weight:800}
.email-live svg{width:14px;height:14px}
.hint{font-size:11.5px;color:var(--ink3);text-align:start;margin:-6px 0 14px;line-height:1.7}
.autherr{background:var(--brand-soft);color:var(--brand);border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;text-align:start}
.autherr svg{width:15px;height:15px;flex-shrink:0}
.fin{width:100%;border:1.5px dashed var(--line);border-radius:11px;padding:11px 14px;font-size:12.5px;background:var(--panel2);color:var(--ink2)}
.fin:focus{outline:0;border-color:var(--brand)}

.settings{height:100%;overflow-y:auto}
.set-wrap{max-width:640px;margin:0 auto;padding:36px 24px 80px}
.set-head{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.set-head svg{width:21px;height:21px;color:var(--brand)}
.set-head h1{font-family:'Lalezar',cursive;font-size:30px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:16px;height:16px;color:var(--brand)}
.pcard{display:flex;align-items:center;gap:18px}
.pcard .avatar{width:64px;height:64px;font-size:26px}
.pcard .pname{font-weight:700;font-size:18px}
.pcard .pmail{color:var(--brand);font-size:13px;direction:ltr;text-align:right;font-weight:600}
.pcard .pjoin{color:var(--ink3);font-size:12px;margin-top:3px}
.pubcta{background:var(--brand);color:#fff;border:0}
.pubcta h3{color:#fff}
.pubcta h3 svg{color:#fff}
.pubcta p{font-size:13px;opacity:.9;line-height:1.8;margin:8px 0 16px}
.pubcta .btn{background:#fff;color:var(--brand);border:0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .info .t{font-weight:600;font-size:14px}
.setrow .info .d{font-size:12px;color:var(--ink2);margin-top:2px}
.switch{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(-19px)}
.mysite{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mysite:last-child{border-bottom:0}
.mysite .m-n{font-weight:700;font-size:14px}
.mysite .m-u{font-size:11.5px;color:var(--ok);direction:ltr;text-align:right}
.mysite .m-v{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:4px;margin-top:2px}
.mysite .m-v svg{width:11px;height:11px}
.mysite .acts{display:flex;gap:4px;margin-inline-start:auto}
.iconbtn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{background:var(--brand-soft);color:var(--brand)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.danger:hover{background:var(--brand);color:#fff}

.prof-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ptabs{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;border:1px solid var(--line)}

.extwrap{height:100%;display:flex;flex-direction:column}

.ext-top .msg{flex:1;line-height:1.6;min-width:0}

.spinner{width:34px;height:34px;border:3.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}

#toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:999;display:flex;flex-direction:column;gap:9px;max-width:340px}

.sg .s-u{font-size:11px;color:var(--ink3);direction:ltr;margin-inline-start:auto;text-align:left}

<script>
/* ============================================================
   أرابكوا — إصلاح طلبات الصداقة وتسجيل الدخول والحسابات
   ============================================================ */

window.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG') {
    if (!t.dataset.failed) { t.dataset.failed = '1';
      t.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#E7E1D8"/><circle cx="40" cy="30" r="13" fill="#B23A2E" opacity=".45"/><rect x="18" y="50" width="44" height="8" rx="4" fill="#B23A2E" opacity=".3"/></svg>'); }
    return;
  }
  if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) return;
  try { toast('خطأ تقني: ' + (e.message || 'غير معروف'), 'bug', true); } catch(_){}
}, true);
window.addEventListener('unhandledrejection', e => {
  try { toast('خطأ تقني: ' + ((e.reason && e.reason.message) || e.reason || 'غير معروف'), 'bug', true); } catch(_){}
});

const $  = s => document.querySelector(s);
const viewport = document.getElementById('viewport');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const uid = () => Math.random().toString(36).slice(2, 10);
const nowISO = () => new Date().toISOString();
const arNum = n => Number(n).toLocaleString('ar-EG');
const fmtDate = iso => new Date(iso).toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
const fmtTime = iso => { const d = new Date(iso); const diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'الآن'; if (diff < 3600) return `قبل ${arNum(Math.floor(diff/60))} دقيقة`;
  if (diff < 86400) return `قبل ${arNum(Math.floor(diff/3600))} ساعة`;
  if (diff < 172800) return 'أمس'; return fmtDate(iso); };
const icons = () => { try { lucide.createIcons(); } catch(e){} };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isNarrow = () => window.matchMedia('(max-width:860px)').matches;
const openExternal = url => { window.open(url, '_blank', 'noopener,noreferrer'); };
const igIco = (cls='') => `<svg class="bean ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>`;
const appIcon = name => name === 'IG' ? igIco() : `<i data-lucide="${name}"></i>`;

function copyText(t){
  const done = () => toast('تم النسخ: ' + t, 'copy');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('انسخه يدويًا: ' + t, 'copy'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
}
function hl(text, q){
  const t = esc(text), qq = esc(q || '').trim();
  if (!qq) return t;
  try { return t.replace(new RegExp(escRe(qq), 'i'), m => `<mark>${m}</mark>`); } catch(e){ return t; }
}
const PALETTE = ['#B23A2E','#2E6E5E','#8A6D2F','#5B4B8A','#2F6C8A','#A8532F','#3F7D20','#8C3E6E'];
const colorFor = s => { let h = 0; for (const ch of (s || 'x')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const letterDot = (text, cls='fd') => { const ch = (text || '؟').trim()[0] || '؟'; return `<span class="${cls}" style="background:${colorFor(text)}">${esc(ch)}</span>`; };
const avatarHTML = (name, size, extra='') => `<span class="avatar ${extra}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px;background:${colorFor(name)}">${esc((name||'؟').trim()[0]||'؟')}</span>`;
const bean = (cls='') => `<svg class="bean ${cls}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="var(--brand)"/><path d="M13.8 3.6C9.2 8.2 15 15.8 10.2 20.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M8.2 6.4C6.6 8.2 6.6 10.2 7.7 11.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".5"/><path d="M16.4 13.6c1.4 1.6 1.3 3.3.2 4.7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".5"/></svg>`;

/* ============ مطابقة عربية مرنة + إيميلات لاتيني ============ */
// تطبيع عربي: يوحّد الهمزات والتاء المربوطة ويشيل التشكيل — عشان البحث والدخول يسامحوا الفروق
const normAr = s => String(s || '').toLowerCase()
  .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
  .replace(/[أإآٱ]/g, 'ا')
  .replace(/ى/g, 'ي').replace(/ئ/g, 'ي')
  .replace(/ؤ/g, 'و')
  .replace(/ة/g, 'ه');

// تحويل حروف عربية لاتيني — عشان الإيميل يبقى قابل للكتابة من أي كيبورد
const AR_TRANS = {'ا':'a','أ':'a','إ':'e','آ':'a','ٱ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'y','ة':'h','ء':'a','ؤ':'w','ئ':'y','َ':'','ً':'','ُ':'','ٌ':'','ِ':'','ٍ':'','ّ':'','ْ':'','ـ':'','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
function translitSlug(s){
  let out = '';
  for (const ch of String(s || '')) out += (Object.prototype.hasOwnProperty.call(AR_TRANS, ch) ? AR_TRANS[ch] : ch);
  return out.toLowerCase().replace(/\s+/g, '.')
    .replace(/[^a-z0-9._-]/g, '')
    .replace(/\.{2,}/g, '.')
    .replace(/^[._-]+/, '')
    .slice(0, 24)
    .replace(/[._-]+$/g, '');
}
// صيغة الإيميل القديمة (بحروف عربية) — بنستخدمها في المطابقة الرجعية بس
function nameToSlug(name){
  return String(name).trim().toLowerCase().replace(/\s+/g, '.')
    .replace(/[^\p{L}\p{N}._-]/gu, '').slice(0, 20)
    .replace(/\.{2,}/g, '.').replace(/^[._-]+|[._-]+$/g, '');
}

// ---------- التخزين ----------
const memStore = {};
let storageOk = true;
try { localStorage.setItem('__arp_t','1'); localStorage.removeItem('__arp_t'); } catch(e){ storageOk = false; }
const DB = {
  get(k, d){ try { const v = localStorage.getItem(k);
    if (v === null) return memStore[k] !== undefined ? memStore[k] : d;
    return JSON.parse(v); } catch(e){ return memStore[k] !== undefined ? memStore[k] : d; } },
  set(k, v){ memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// ---------- وسائط (IndexedDB) ----------
let idbDB = null;
function idbOpen(){ return new Promise(res => { try {
  const r = indexedDB.open('arabikwa-media', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('media');
  r.onsuccess = () => { idbDB = r.result; res(true); };
  r.onerror = () => res(false);
} catch(e){ res(false); } }); }
function idbPut(key, blob){ return new Promise(res => { if(!idbDB) return res(false); try {
  const tx = idbDB.transaction('media','readwrite');
  tx.objectStore('media').put(blob, key);
  tx.oncomplete = () => res(true); tx.onerror = () => res(false);
} catch(e){ res(false); } }); }
function idbGet(key){ return new Promise(res => { if(!idbDB) return res(null); try {
  const rq = idbDB.transaction('media','readonly').objectStore('media').get(key);
  rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
} catch(e){ res(null); } }); }
function idbDel(key){ return new Promise(res => { if(!idbDB) return res(); try {
  const tx = idbDB.transaction('media','readwrite');
  tx.objectStore('media').delete(key);
  tx.oncomplete = () => res(); tx.onerror = () => res();
} catch(e){ res(); } }); }
const mediaURLCache = {};
async function mediaURL(id){ if (mediaURLCache[id]) return mediaURLCache[id];
  const b = await idbGet(id); if (b) { mediaURLCache[id] = URL.createObjectURL(b); return mediaURLCache[id]; } return ''; }
async function hydrateMedia(root){
  for (const el of root.querySelectorAll('[data-media]')){
    const url = await mediaURL(el.dataset.media); if (url) el.src = url;
  }
}
async function saveMedia(id, file){
  mediaURLCache[id] = URL.createObjectURL(file);
  const ok = await idbPut(id, file);
  if (!ok) toast('الملف اشتغل للجلسة بس — التخزين الدائم مرفوض من المتصفح', 'shield', true);
}
async function deleteMedia(id){
  if (mediaURLCache[id]) { try { URL.revokeObjectURL(mediaURLCache[id]); } catch(e){} delete mediaURLCache[id]; }
  await idbDel(id);
}

// ---------- قوالب ----------
const TPL_CARD = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><style>

<p class="bio">اكتب نبذة قصيرة عنك هنا... عدّل هذا القالب كما تريد ثم انشره على شبكة أرابكوا.</p>
<div class="links"><a href="#">أعمالي</a><a href="#">تواصل معي</a></div></div></body></html>`;
const TPL_STORE = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0}body{font-family:Tahoma,Arial,sans-serif;background:#faf6f0;color:#2b211b}
header{background:#3a2a20;color:#fff;padding:16px 26px}.logo{font-weight:800;font-size:20px;color:#e8b98a}
.hero{padding:60px 26px;text-align:center;background:#4a3527;color:#fff}
.hero h1{font-size:32px}.hero p{color:#d8c3ae;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding:30px;max-width:860px;margin:auto}

/* ============ ترحيل الإيميلات العربية لاتيني (يصلّح الحسابات القديمة) ============ */
(function migrateArabicEmails(){
  const needs = users.filter(u => /[^\u0000-\u007F]/.test((u.email || '').split('@')[0]));
  if (!needs.length) return;
  const map = {};
  const taken = new Set(users.map(u => (u.email || '').toLowerCase()));
  for (const u of needs){
    let base = translitSlug(u.name) || translitSlug((u.email || '').split('@')[0]) || 'user';
    let cand = base, i = 1;
    while (taken.has(cand + '@arpico.com')) { i++; cand = base + '-' + i; }
    map[(u.email || '').toLowerCase()] = cand + '@arpico.com';
    taken.add(cand + '@arpico.com');
  }
  const remap = e => map[String(e || '').toLowerCase()] || e;
  users.forEach(u => { if (map[(u.email || '').toLowerCase()]) u.email = map[(u.email || '').toLowerCase()]; });
  DB.set('arp_users', users);
  const nf = {};
  for (const k of Object.keys(friends || {})) nf[remap(k)] = (friends[k] || []).map(remap);
  friends = nf; DB.set('arp_friends', friends);
  friendReqs.forEach(r => { r.from = remap(r.from); r.to = remap(r.to); }); DB.set('arp_friend_reqs', friendReqs);
  mail.forEach(m => { m.from = remap(m.from); m.to = remap(m.to); }); DB.set('arp_mail', mail);
  chatMsgs.forEach(m => { m.from = remap(m.from); m.to = remap(m.to); }); DB.set('arp_chat_msgs', chatMsgs);
  sites.forEach(s => { if (s.authorEmail) s.authorEmail = remap(s.authorEmail); }); DB.set('arp_sites', sites);
  instaPosts.forEach(p => { if (p.authorEmail) p.authorEmail = remap(p.authorEmail); }); DB.set('arp_insta_posts', instaPosts);
  tkPosts.forEach(p => { if (p.authorEmail) p.authorEmail = remap(p.authorEmail); }); DB.set('arp_tk_posts', tkPosts);
  ytPosts.forEach(p => { if (p.authorEmail) p.authorEmail = remap(p.authorEmail); }); DB.set('arp_yt_posts', ytPosts);
  browseHist.forEach(h => { if (h.data && h.data.email) h.data.email = remap(h.data.email); }); DB.set('arp_history', browseHist);
})();

// إصلاح الجلسة القديمة
if (session && !users.some(u => u.email === session)) {
  const legacy = users.find(u => u.name === session || u.email === session);
  session = legacy ? legacy.email : null;
  DB.set('arp_session', session);
}

const me = () => users.find(u => u.email === session) || null;
const unread = () => { const u = me(); return u ? mail.filter(m => m.to === u.email && !m.read && !m.trashed && !m.draft).length : 0; };
const unreadChats = () => { const u = me(); return u ? chatMsgs.filter(m => m.to === u.email && !m.read).length : 0; };
const incomingReqs = () => { const u = me(); return u ? friendReqs.filter(r => r.status === 'pending' && r.to === u.email) : []; };
const displayNameFor = email => (users.find(x => x.email === email) || {}).name || email;

/* ============ الصداقات ============ */
const areFriends = (a,b) => (friends[a]||[]).includes(b);
function setFriends(a,b,val){
  friends[a] = friends[a] || []; friends[b] = friends[b] || [];
  if (val){ if(!friends[a].includes(b)) friends[a].push(b); if(!friends[b].includes(a)) friends[b].push(a); }
  else { friends[a] = friends[a].filter(x=>x!==b); friends[b] = friends[b].filter(x=>x!==a); }
  DB.set('arp_friends', friends);
}
const reqBetween = (a,b) => friendReqs.find(r => r.status==='pending' && ((r.from===a&&r.to===b)||(r.from===b&&r.to===a)));

function sendFriendReq(to){
  const u = me();
  if (!u) { toast('سجّل الدخول الأول عشان تبعت طلب صداقة', 'lock', true); return; }
  if (!to) { toast('مفيش حساب محدد — افتح بروفايل الشخص أو دوّر عليه في الدردشة', 'shield', true); return; }
  if (to === u.email) { toast('مينفعش تضيف نفسك', 'shield', true); return; }
  if (!users.some(x => x.email === to)) { toast(`الحساب "${to}" مش موجود على أرابكوا`, 'shield', true); return; }
  if (areFriends(u.email, to)) { toast(`إنتوا أصحاب بالفعل`, 'user-check'); return; }
  if (reqBetween(u.email, to)) { toast('في طلب صداقة معلق بينكم بالفعل', 'clock'); return; }
  friendReqs.push({id:uid(), from:u.email, to, date:nowISO(), status:'pending'});
  DB.set('arp_friend_reqs', friendReqs);
  toast(`تم إرسال طلب الصداقة لـ ${displayNameFor(to)}`, 'user-plus');
}
function acceptReq(id){
  const r = friendReqs.find(x => x.id === id); if (!r) return;
  r.status = 'accepted'; setFriends(r.from, r.to, true);
  DB.set('arp_friend_reqs', friendReqs);
  toast(`أنت و ${displayNameFor(r.from)} بقيتوا أصدقاء`, 'user-check');
}
function rejectReq(id){
  const r = friendReqs.find(x => x.id === id); if (!r) return;
  r.status = 'rejected'; DB.set('arp_friend_reqs', friendReqs);
  toast('تم رفض الطلب', 'user-x');
}

function uniqueEmailSlug(slug){
  let base = slug || 'user', i = 1, cand = base;
  while (users.some(u => u.email === cand + '@arpico.com')) { i++; cand = base + '-' + i; }
  return cand;
}
// الإيميل النهائي: دايمًا لاتيني قابل للكتابة من أي كيبورد
function generateEmail(rawName){
  return uniqueEmailSlug(translitSlug(rawName)) + '@arpico.com';
}
const siteSlugify = v => String(v).trim().toLowerCase().replace(/\s+/g, '-').replace(/[^\p{L}\p{N}-]/gu, '').replace(/^-+|-+$/g, '');

function rememberQ(q){
  q = (q || '').trim(); if (!q) return;
  recentQ = [q, ...recentQ.filter(x => x !== q)].slice(0, 8);
  DB.set('arp_recent_q', recentQ);
}
function pushHistory(page, data, title){
  if (page === 'ntp' || page === 'login') return;
  const key = page + JSON.stringify(data || {});
  if (browseHist[0] && browseHist[0].key === key) browseHist[0].time = nowISO();
  else browseHist.unshift({key, page, data:{...(data || {})}, title, time:nowISO()});
  browseHist = browseHist.slice(0, 40); DB.set('arp_history', browseHist);
}

];
const norm = s => String(s || '').toLowerCase().trim();
const matchSite = (s, q) => norm(s.name).includes(q) || norm(s.desc).includes(q) || norm(s.keywords).includes(q) || norm(s.slug).includes(q) || norm(s.author).includes(q);
function searchIndex(q){
  q = norm(q);
  if (!q) return {apps:[], net:[], web:[]};
  const rank = a => { const n = norm(a.site?.name || a.name || a.web?.name); return n.startsWith(q) ? 0 : 1; };
  const apps = APPS.filter(a => norm(a.name).includes(q) || norm(a.desc).includes(q)).map(a => ({kind:'app', ...a}));
  const net  = sites.filter(s => matchSite(s, q)).map(s => ({kind:'site', site:s}));
  const web  = WEB.filter(w => norm(w.name).includes(q) || norm(w.desc).includes(q) || norm(w.url).includes(q)).map(w => ({kind:'web', web:w}));
  [apps, net, web].forEach(arr => arr.sort((a,b) => rank(a) - rank(b)));
  return {apps, net, web};
}
function buildSugg(q){
  q = norm(q); if (!q) return [];
  const out = [];
  for (const a of APPS) if (norm(a.name).includes(q)) out.push({icon:a.icon, t:a.name, u:'تطبيق أرابكوا', act:() => navigate(a.ref)});
  for (const s of sites) if (matchSite(s, q)) out.push({t:s.name, u:s.slug + '.arpico', dot:true, act:() => navigate('site', {siteId:s.id})});
  for (const w of WEB) if (norm(w.name).includes(q)) out.push({icon:'globe', t:w.name, u:w.url.replace('https://',''), act:() => navigate('site', {url:w.url, title:w.name})});
  return out.slice(0, 6);
}

function pageMeta(page, data = {}){
  switch (page) {
    case 'ntp':      return {title:'تاب جديد', url:'arpico://home'};
    case 'search':   return {title:`بحث: ${data.q || ''}`, url:`arpico://search?q=${encodeURIComponent(data.q || '')}`};
    case 'login':    return {title:'تسجيل الدخول', url:'arpico://id'};
    case 'mail':     return {title:'أرابكوا ميل', url:'arpico://mail'};
    case 'chat':     return {title:'الدردشة', url:'arpico://chat'};
    case 'insta':    return {title:'انستا على أرابكوا', url:'arpico://insta'};
    case 'tiktok':   return {title:'تيك توك على أرابكوا', url:'arpico://tiktok'};
    case 'yt':       return {title:'يوتيوب أرابكوا', url:'arpico://yt'};
    case 'settings': return {title:'إعدادات الحساب', url:'arpico://settings'};
    case 'publish':  return {title:'انشر موقعك', url:'arpico://publish'};
    case 'network':  return {title:'شبكة أرابكوا', url:'arpico://network'};
    case 'profile':  { const u = users.find(x => x.email === (data.email||'').toLowerCase());
      return {title:u ? `بروفايل ${u.name}` : 'بروفايل', url:'arpico://profile'}; }
    case 'site':
      if (data.siteId) { const s = sites.find(x => x.id === data.siteId);
        return {title:s ? s.name : 'موقع', url:s ? `${s.slug}.arpico` : 'arpico://site'}; }
      return {title:data.title || 'موقع خارجي', url:data.url || 'about:blank'};
  }
  return {title:'صفحة', url:'arpico://page'};
}

const cur = () => tabs.find(t => t.id === activeTab);
const curPage = () => { const t = cur(); return t ? t.hist[t.hi] : null; };

function newTab(page = 'ntp', data = {}){
  if (page !== 'login') pendingNav = null;
  const meta = pageMeta(page, data);
  const t = {id:++tabSeq, hist:[{page, data, title:meta.title, url:meta.url}], hi:0};
  tabs.push(t); activeTab = t.id;
  pushHistory(page, data, meta.title);
  renderAll();
}
function closeTab(id){
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  tabs.splice(i, 1);
  if (!tabs.length) { newTab('ntp'); return; }
  if (activeTab === id) activeTab = tabs[Math.max(0, i - 1)].id;
  renderAll();
}
function activateTab(id){ activeTab = id; renderAll(); }
function navigate(page, data = {}){
  if (page !== 'login') pendingNav = null;
  if (page === 'search') searchUI.filter = 'all';
  const t = tabs.find(x => x.id === activeTab); if (!t) return;
  const meta = pageMeta(page, data);
  t.hist = t.hist.slice(0, t.hi + 1);
  t.hist.push({page, data, title:meta.title, url:meta.url});
  t.hi = t.hist.length - 1;
  pushHistory(page, data, meta.title);
  renderAll();
}
function goPublishNew(){ publishEditIntent = null; navigate('publish'); }
const goProfile = email => navigate('profile', {email:(email||'').toLowerCase()});

function tabFavicon(p){
  const page = p.page, d = p.data || {};
  if (page === 'ntp')      return bean();
  if (page === 'mail')     return `<span class="fico"><i data-lucide="mail"></i>${unread() ? '<span class="tb-dot"></span>' : ''}</span>`;
  if (page === 'chat')     return `<span class="fico"><i data-lucide="message-circle"></i>${(unreadChats() || incomingReqs().length) ? '<span class="tb-dot"></span>' : ''}</span>`;
  if (page === 'insta')    return `<span class="fico">${igIco()}</span>`;
  if (page === 'tiktok')   return `<span class="fico"><i data-lucide="music-2"></i></span>`;
  if (page === 'yt')       return `<span class="fico"><i data-lucide="video"></i></span>`;
  if (page === 'profile')  return `<span class="fico"><i data-lucide="user"></i></span>`;
  if (page === 'settings') return `<span class="fico"><i data-lucide="settings"></i></span>`;
  if (page === 'publish')  return `<span class="fico"><i data-lucide="upload"></i></span>`;
  if (page === 'network')  return `<span class="fico"><i data-lucide="globe"></i></span>`;
  if (page === 'search')   return `<span class="fico"><i data-lucide="search"></i></span>`;
  if (page === 'login')    return `<span class="fico"><i data-lucide="user"></i></span>`;
  if (page === 'site') return d.siteId ? letterDot(sites.find(s => s.id === d.siteId)?.slug || '؟')
                                       : `<span class="fico"><i data-lucide="globe"></i></span>`;
  return letterDot('؟');
}

  const t = cur();
  if (!t) { $('#tabs').innerHTML = ''; $('#backBtn').disabled = true; $('#fwdBtn').disabled = true; return; }
  $('#tabs').innerHTML = tabs.map(tb => {
    const p = tb.hist[tb.hi];
    return `<div class="tab ${tb.id === activeTab ? 'active' : ''}" data-id="${tb.id}" title="${esc(p.title)}">
      <span class="tfav">${tabFavicon(p)}</span>
      <span class="ttl">${esc(p.title)}</span>
      <button class="tclose" data-close="${tb.id}" title="إغلاق التاب"><i data-lucide="x"></i></button>
    </div>`;
  }).join('');
  $('#backBtn').disabled = t.hi <= 0;
  $('#fwdBtn').disabled  = t.hi >= t.hist.length - 1;
  const at = $('#tabs .tab.active');
  if (at && at.scrollIntoView) try { at.scrollIntoView({block:'nearest', inline:'nearest'}); } catch(e){}
}

function toast(msg, icon='check', isErr=false){
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : '');
  t.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t); icons();
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 350); }, 6000);
}

function attachSugg(input, box){
  const render = () => {
    const list = buildSugg(input.value);
    if (!list.length) { box.classList.remove('open'); return; }
    box.innerHTML = list.map((s, i) => `<div class="sg" data-i="${i}">${s.dot ? letterDot(s.u.replace('.arpico','')) : appIcon(s.icon)}<span class="s-t">${esc(s.t)}</span><span class="s-u">${esc(s.u)}</span></div>`).join('');
    box.classList.add('open'); icons();
    box.querySelectorAll('.sg').forEach(el => el.addEventListener('mousedown', e => { e.preventDefault(); list[+el.dataset.i].act(); box.classList.remove('open'); }));
  };
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 150));
}

function omniboxSubmit(v){
  v = (v || '').trim(); if (!v) return;
  if (/^arpico:\/\//i.test(v)) {
    const rest = v.replace(/^arpico:\/\//i, '').replace(/\/+$/, '');
    const [pg, qs] = rest.split('?');
    const map = {home:'ntp', newtab:'ntp', mail:'mail', chat:'chat', insta:'insta', tiktok:'tiktok', yt:'yt', settings:'settings', publish:'publish', network:'network', id:'login', account:'settings'};
    if (map[pg]) return map[pg] === 'publish' ? goPublishNew() : navigate(map[pg]);
    if (pg === 'search') { const q = new URLSearchParams(qs || '').get('q') || ''; rememberQ(q); return navigate('search', {q}); }
    return navigate('ntp');
  }
  // لو كتب إيميل arpico → افتح البروفايل (مع مطابقة مرنة)
  if (/@arpico\.com$/i.test(v)) {
    const hit = users.find(x => (x.email||'').toLowerCase() === v.toLowerCase())
      || users.find(x => normAr((x.email||'').toLowerCase()) === normAr(v.toLowerCase()));
    if (hit) return goProfile(hit.email);
  }
  const cleaned = v.toLowerCase().replace(/\.arpico\/?$/, '').replace(/\/+$/, '');
  let hit = sites.find(s => s.slug.toLowerCase() === cleaned);
  if (!hit) { const sl = siteSlugify(v); if (sl) hit = sites.find(s => s.slug === sl); }
  if (hit) return navigate('site', {siteId:hit.id});
  if (/^(https?:\/\/|www\.)/i.test(v) || /^[\p{L}\p{N}-]+(\.[\p{L}\p{N}-]+)+(\/\S*)?$/iu.test(v))
    return navigate('site', {url:v.startsWith('http') ? v : 'https://' + v, title:v});
  rememberQ(v); navigate('search', {q:v});
}

function startVoice(btn, cb){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('البحث الصوتي غير مدعوم في هذا المتصفح', 'mic'); return; }
  if (btn.dataset.live === '1') return;
  let r; try { r = new SR(); } catch(e) { toast('تعذر تشغيل الميكروفون', 'mic'); return; }
  r.lang = 'ar-EG'; r.interimResults = false; r.maxAlternatives = 1;
  btn.dataset.live = '1'; btn.classList.add('listening');
  r.onresult = e => cb(e.results[0][0].transcript);
  r.onend = () => { btn.dataset.live = '0'; btn.classList.remove('listening'); };
  r.onerror = () => { btn.dataset.live = '0'; btn.classList.remove('listening'); toast('ما سمعتك كويس، جرّب تاني', 'mic'); };
  try { r.start(); } catch(e) { toast('الميكروفون مشغول حاليًا', 'mic'); }
}

      u = users.find(x => (x.email||'').toLowerCase() === id);

      if (!u && !id.includes('@')) u = users.find(x => (x.email||'').toLowerCase() === id + '@arpico.com');
      // 3) إيميل قديم بحروف عربية بعد تطبيع الهمزات
      if (!u) u = users.find(x => normAr((x.email||'').toLowerCase()).replace(/\s+/g,'') === normAr(id).replace(/\s+/g,''));

          normAr((x.name||'').toLowerCase()).replace(/\s+/g,' ').trim() === idN ||
          normAr((x.name||'').toLowerCase()).replace(/\s+/g,'') === idN.replace(/\s+/g,''));
        u = cands.find(x => x.pass === pw) || cands[0] || null;
      }
      // 5) بالإيميل المتولد من الاسم (أي صيغة قديمة أو جديدة)
      if (!u && !id.includes('@')) {
        const guesses = [translitSlug(raw), nameToSlug(raw), id.replace(/\s+/g, '.')]
          .filter(Boolean).map(s => s + '@arpico.com');
        u = users.find(x => guesses.includes((x.email||'').toLowerCase()));

}

      </div>

  </div></div>`;

  const nameEl = $('#pName'), slugEl = $('#pSlug'), descEl = $('#pDesc'), keyEl = $('#pKey'), gEl = $('#pGoogle'), htmlEl = $('#pHtml'), pv = $('#pvFrame');

  const updPreview = debounce(() => pv.setAttribute('srcdoc', htmlEl.value || emptyPv), 250);
  nameEl.addEventListener('input', () => { if (!slugDirty) slugEl.value = siteSlugify(nameEl.value); });
  slugEl.addEventListener('input', () => slugDirty = true);
  descEl.addEventListener('input', () => descDirty = true);
  htmlEl.addEventListener('input', updPreview);
  pv.setAttribute('srcdoc', htmlEl.value || emptyPv);

    if (!descDirty) descEl.value = `موقع ${nameEl.value} على شبكة أرابكوا`;
    updPreview(); toast('تم تحميل القالب — عدّله زي ما تحب', 'pen-line');
  });
  const ce = $('#cancelEdit');
  if (ce) ce.onclick = () => { renderPublish(); icons(); };

    const err = m => { toast(m, 'shield'); return false; };
    if (name.length < 2) return err('اكتب اسم للموقع (حرفين على الأقل).');
    if (desc.length < 8) return err('الوصف قصير أوي — خليه واضح عشان يظهر في البحث.');

    if (html.trim().length < 30) return err('محتوى الموقع قصير أوي — لو محتار ابدأ بقالب جاهز.');
    if (editing) {
      let final = slug, i = 2;
      while (sites.some(s => s.slug === final && s.id !== editing.id)) { final = slug + '-' + i++; }
      Object.assign(editing, {slug:final, name, desc, keywords:keyEl.value.trim(), html, googleUrl:g, updated:nowISO()});
      DB.set('arp_sites', sites);
      toast('تم حفظ التعديلات', 'check');
      return navigate('site', {siteId:editing.id});
    }
    let final = slug, i = 2;
    while (sites.some(s => s.slug === final)) { final = slug + '-' + i++; }
    const s = {id:uid(), slug:final, name, desc, keywords:keyEl.value.trim(), googleUrl:g, html, author:u.name, authorEmail:u.email, date:nowISO(), views:0};
    sites.push(s); DB.set('arp_sites', sites);
    toast('مبروك! موقعك انشر وظهر في بحث أرابكوا', 'sparkles');
    navigate('site', {siteId:s.id});
  };
}

      return;

    const q = norm(netUI.q);
    let list = sites.filter(s => !q || matchSite(s, q));
    if (netUI.sort === 'new') list.sort((a,b) => new Date(b.date) - new Date(a.date));
    else if (netUI.sort === 'views') list.sort((a,b) => b.views - a.views);
    else list.sort((a,b) => a.name.localeCompare(b.name, 'ar'));
    $('#netList').innerHTML = list.length ? list.map(s => `<div class="netrow" data-id="${s.id}">
      ${letterDot(s.slug, 'avatar')}
      <div><div class="n-name">${esc(s.name)}</div><div class="n-url">${esc(s.slug)}.arpico</div>
        <div class="n-desc">${esc(s.desc)}</div>
        <div class="n-meta"><span><i data-lucide="eye"></i> ${arNum(s.views)} زيارة</span>
        <span data-prof="${esc(s.authorEmail || '')}" style="cursor:pointer;font-weight:600;color:var(--ink2)"><i data-lucide="user"></i> ${esc(s.author)}</span>
        <span><i data-lucide="clock"></i> ${fmtDate(s.date)}</span>
        ${s.googleUrl ? `<span class="gtag" data-g="${esc(s.googleUrl)}"><i data-lucide="external-link"></i> النسخة على جوجل</span>` : ''}</div></div>
      <span class="go btn" style="padding:8px 16px;font-size:12px">زيارة</span>
    </div>`).join('') : `<div class="net-empty">ما لقيناش مواقع مطابقة.</div>`;

    $('#netList').querySelectorAll('.netrow').forEach(r => r.onclick = e => {
      const up = e.target.closest('[data-prof]');

      navigate('site', {siteId:r.dataset.id});
    });

/* ============ البريد ============ */
function mailFolders(u){
  return {
    inbox:   mail.filter(m => m.to === u.email && !m.trashed && !m.draft).sort((a,b) => new Date(b.date) - new Date(a.date)),
    sent:    mail.filter(m => m.from === u.email && !m.trashed && !m.draft).sort((a,b) => new Date(b.date) - new Date(a.date)),
    drafts:  mail.filter(m => m.from === u.email && m.draft && !m.trashed).sort((a,b) => new Date(b.date) - new Date(a.date)),
    starred: mail.filter(m => m.star && !m.trashed && !m.draft && (m.to === u.email || m.from === u.email)).sort((a,b) => new Date(b.date) - new Date(a.date)),
    trash:   mail.filter(m => m.trashed && (m.to === u.email || m.from === u.email)).sort((a,b) => new Date(b.date) - new Date(a.date)),
  };
}

  const fNames = {inbox:'الوارد', sent:'المُرسَل', drafts:'المسودات', starred:'المميّزة', trash:'المهملات'};
  const fIcons = {inbox:'inbox', sent:'send', drafts:'pencil', starred:'star', trash:'trash-2'};

  viewport.innerHTML = `<div class="mail page">

            <div class="m-s">${esc(m.subject || '(بدون عنوان)')}</div>

                <button class="iconbtn danger" data-purge="${m.id}" title="حذف نهائي"><i data-lucide="trash-2"></i></button>

    </div>
    <div class="mail-read">
      ${openMsg ? `<div class="mr-head">
          <div style="flex:1;min-width:0"><h2>${esc(openMsg.subject || '(بدون عنوان)')}</h2>
          <div class="mr-meta">من <span class="from">${esc(openMsg.from)}</span> إلى <span style="direction:ltr">${esc(openMsg.to)}</span> — ${fmtTime(openMsg.date)}</div></div>
          <div class="mr-acts">
            ${mailUI.folder === 'trash'
              ? `<button class="iconbtn" id="mrRestore" title="استرجاع"><i data-lucide="rotate-ccw"></i></button>
                 <button class="iconbtn danger" id="mrPurge" title="حذف نهائي"><i data-lucide="trash-2"></i></button>`
              : `<button class="iconbtn" id="mrReply" title="رد"><i data-lucide="reply"></i></button>
                 <button class="iconbtn" id="mrStar" title="نجمة"><i data-lucide="star"></i></button>
                 <button class="iconbtn danger" id="mrTrash" title="نقل للمهملات"><i data-lucide="trash-2"></i></button>`}
          </div>
        </div><div class="mr-body">${esc(openMsg.body)}</div>`
      : `<div class="mr-empty"><i data-lucide="mail"></i>اختر رسالة من القائمة لتقرأها</div>`}
    </div>
  </div>`;

  $('#composeBtn').onclick = () => openCompose();
  viewport.querySelectorAll('.mf').forEach(b => b.onclick = () => { mailUI.folder = b.dataset.f; mailUI.open = null; renderMail(); icons(); });
  const et = $('#emptyTrash');
  if (et) et.onclick = () => confirmBox('هتحذف كل رسايل المهملات نهائيًا. متأكد؟', () => {
    mail = mail.filter(m => !m.trashed); DB.set('arp_mail', mail);
    mailUI.open = null; toast('تم تفريغ المهملات', 'trash-2'); renderMail(); icons();
  });
  viewport.querySelectorAll('.mrow').forEach(r => r.onclick = e => {
    if (e.target.closest('[data-star],[data-restore],[data-purge]')) return;
    const m = mail.find(x => x.id === r.dataset.m); if (!m) return;
    if (m.draft) return openCompose({to:m.to, subject:m.subject, body:m.body}, m.id);
    if (m.to === u.email && !m.read) { m.read = true; DB.set('arp_mail', mail); }
    if (isNarrow()) { openMailModal(m); renderMail(); icons(); return; }
    mailUI.open = m.id; renderMail(); icons();
  });
  viewport.querySelectorAll('[data-star]').forEach(b => b.onclick = e => {
    e.stopPropagation(); const m = mail.find(x => x.id === b.dataset.star);
    m.star = !m.star; DB.set('arp_mail', mail); renderMail(); icons();
  });
  viewport.querySelectorAll('[data-restore]').forEach(b => b.onclick = e => {
    e.stopPropagation(); const m = mail.find(x => x.id === b.dataset.restore);
    m.trashed = false; DB.set('arp_mail', mail); toast('رجعت الرسالة للبريد', 'rotate-ccw'); renderMail(); icons();
  });
  viewport.querySelectorAll('[data-purge]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    confirmBox('الحذف النهائي مفيش منه رجوع. متأكد؟', () => {
      mail = mail.filter(x => x.id !== b.dataset.purge); DB.set('arp_mail', mail);
      if (mailUI.open === b.dataset.purge) mailUI.open = null;
      toast('اتحذفت نهائيًا', 'trash-2'); renderMail(); icons();
    });
  });
  const bindAct = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  bindAct('#mrReply', () => {
    const m = mail.find(x => x.id === mailUI.open);
    const to = m.from === u.email ? m.to : m.from;
    openCompose({to, subject:'رد: ' + (m.subject || ''),
      quote:`\n\n----------\nفي ${fmtTime(m.date)}، كتب ${m.fromName || displayNameFor(m.from)}:\n${m.body}`});
  });
  bindAct('#mrStar', () => { const m = mail.find(x => x.id === mailUI.open); m.star = !m.star; DB.set('arp_mail', mail); renderMail(); icons(); });
  bindAct('#mrTrash', () => {
    const m = mail.find(x => x.id === mailUI.open);
    m.trashed = true; DB.set('arp_mail', mail); mailUI.open = null;
    toast('الرسالة اتنقلت للمهملات', 'trash-2'); renderMail(); icons();
  });
  bindAct('#mrRestore', () => { const m = mail.find(x => x.id === mailUI.open); m.trashed = false; DB.set('arp_mail', mail); mailUI.open = null; toast('رجعت الرسالة', 'rotate-ccw'); renderMail(); icons(); });
  bindAct('#mrPurge', () => confirmBox('الحذف النهائي مفيش منه رجوع. متأكد؟', () => {
    mail = mail.filter(x => x.id !== mailUI.open); DB.set('arp_mail', mail);
    mailUI.open = null; toast('اتحذفت نهائيًا', 'trash-2'); renderMail(); icons();
  }));
}

    <div class="mr-meta" style="margin-bottom:14px">من <span class="from">${esc(m.fromName || displayNameFor(m.from))}</span> — ${fmtTime(m.date)}</div>

    <div class="macts">
      <button class="btn" id="mmTrash"><i data-lucide="trash-2"></i> مهملات</button>
      <button class="btn primary" id="mmReply"><i data-lucide="reply"></i> رد</button>
    </div>`);
  $('#mmTrash').onclick = () => {
    m.trashed = true; DB.set('arp_mail', mail);
    if (mailUI.open === m.id) mailUI.open = null;
    closeModal(); toast('الرسالة اتنقلت للمهملات', 'trash-2'); renderMail(); icons();
  };
  $('#mmReply').onclick = () => {
    const to = m.from === u.email ? m.to : m.from;
    openCompose({to, subject:'رد: ' + (m.subject || ''),

}
function openCompose(pre = {}, draftId = null){
  const u = me(); if (!u) return;
  openModal(`<h3><i data-lucide="pen-line"></i> ${draftId ? 'تعديل المسودة' : 'رسالة جديدة'}</h3>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:12px;direction:ltr;text-align:right">من: ${esc(u.email)}</div>
    <div class="field"><label>إلى (لازم تكون صيغة arpico.com ومسجلة فعلاً)</label><input id="cTo" dir="ltr" value="${esc(pre.to || '')}" placeholder="name@arpico.com"></div>
    <div class="field"><label>الموضوع</label><input id="cSub" value="${esc(pre.subject || '')}" placeholder="موضوع الرسالة"></div>
    <div class="field"><label>الرسالة</label><textarea id="cBody" rows="6" style="width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;font-size:13.5px;background:var(--panel2);outline:0;resize:vertical">${esc(pre.body || pre.quote || '')}</textarea></div>
    <div class="macts">
      <button class="btn" id="cCancel">إلغاء</button>
      <button class="btn" id="cSave"><i data-lucide="pencil"></i> حفظ كمسودة</button>
      <button class="btn primary" id="cSend"><i data-lucide="send"></i> إرسال</button>
    </div>`);
  $('#cCancel').onclick = closeModal;
  const collect = () => ({
    to: ($('#cTo').value || '').trim().toLowerCase(),
    subject: $('#cSub').value.trim(),
    body: ($('#cBody').value || '').trim(),
  });
  $('#cSave').onclick = () => {
    const d = collect();
    if (!d.to && !d.subject && !d.body) { closeModal(); return; }
    if (draftId) { const m = mail.find(x => x.id === draftId); if (m) Object.assign(m, d, {date: nowISO()}); }
    else mail.push({id:uid(), from:u.email, fromName:u.name, to:d.to, subject:d.subject, body:d.body, date:nowISO(), read:true, star:false, trashed:false, draft:true});
    DB.set('arp_mail', mail); closeModal();
    toast('تم حفظ المسودة', 'pencil');
    mailUI.folder = 'drafts'; mailUI.open = null; renderMail(); icons();
  };
  $('#cSend').onclick = () => {
    const d = collect();
    if (!/@arpico\.com$/.test(d.to)) { toast('الإيميل لازم ينتهي بـ @arpico.com', 'shield'); return; }
    if (!users.some(x => x.email === d.to)) { toast('ما فيش حد مسجل بالإيميل ده على أرابكوا', 'shield'); return; }
    if (!d.body) { toast('اكتب الرسالة الأول', 'pen-line'); return; }
    if (draftId) { const m = mail.find(x => x.id === draftId); if (m) Object.assign(m, d, {date: nowISO(), draft:false, read:false}); }
    else mail.push({id:uid(), from:u.email, fromName:u.name, to:d.to, subject:d.subject, body:d.body, date:nowISO(), read:false, star:false, trashed:false, draft:false});
    DB.set('arp_mail', mail);
    closeModal(); toast('تم إرسال الرسالة بنجاح', 'send');
    mailUI.folder = 'sent'; mailUI.open = null; renderMail(); icons();
  };
}

/* ============ الدردشة + المكالمات ============ */
function chatFoundCard(email, u){
  const peer = users.find(x => x.email === email);
  if (!peer) return '';
  const isF = areFriends(u.email, email);
  const req = reqBetween(u.email, email);
  let fHtml;
  if (isF) fHtml = `<span class="rtag">أصدقاء</span>`;
  else if (req && req.from === u.email) fHtml = `<span class="rtag" style="opacity:.75">طلبك مرسل</span>`;
  else if (req) fHtml = `<button class="iconbtn" data-act="acceptReq" data-peer="${esc(email)}" title="موافقة على طلبه" style="color:var(--ok)"><i data-lucide="check"></i></button>`;
  else fHtml = `<button class="iconbtn" data-act="addFriend" data-peer="${esc(email)}" title="إضافة صديق"><i data-lucide="user-plus"></i></button>`;
  return `<div class="found">${avatarHTML(peer.name, 42)}
    <div class="fi"><div class="fn">${esc(peer.name)}</div><div class="fe">${esc(peer.email)}</div></div>
    <div class="fa">${fHtml}
      <button class="iconbtn" data-act="chatWith" data-peer="${esc(email)}" title="محادثة"><i data-lucide="message-circle"></i></button>
      <button class="iconbtn" data-act="callVideo" data-peer="${esc(email)}" title="مكالمة فيديو"><i data-lucide="video"></i></button>
    </div></div>`;
}

function renderChat(){
  const u = me();
  if (!u) { pendingNav = {page:'chat'}; viewport.innerHTML = guestPanel(); bindGuestPanel(); return; }
  const reqs = incomingReqs();
  const myFriends = (friends[u.email] || []);
  const convMap = {};
  for (const m of chatMsgs) {
    if (m.from !== u.email && m.to !== u.email) continue;
    const peer = m.from === u.email ? m.to : m.from;
    if (!convMap[peer] || new Date(m.date) > new Date(convMap[peer].date)) convMap[peer] = m;
  }
  const convs = Object.entries(convMap).sort((a,b) => new Date(b[1].date) - new Date(a[1].date));
  const peers = [...new Set([...convs.map(c => c[0]), ...myFriends])];

  viewport.innerHTML = `<div class="chat page">
    <div class="chat-side">
      <div class="chat-search">
        <input id="chatQ" dir="ltr" placeholder="friend@arpico.com أو اسم صاحبك" value="${esc(chatUI.q)}">
        <button class="btn primary fbtn" id="chatFind"><i data-lucide="search"></i> ابحث عن صاحبك</button>
      </div>
      ${(chatUI.foundList || []).map(em => chatFoundCard(em, u)).join('')}
      ${reqs.length ? `<div class="chat-sec"><i data-lucide="user-plus"></i> طلبات الصداقة (${arNum(reqs.length)})</div>
        ${reqs.map(r => `<div class="reqrow">${avatarHTML(displayNameFor(r.from), 38)}
          <div class="fi"><div class="fn">${esc(displayNameFor(r.from))}</div><div class="fe">${esc(r.from)}</div></div>
          <div class="reqacts">
            <button class="iconbtn" data-act="acceptReq" data-req="${r.id}" title="موافقة" style="color:var(--ok)"><i data-lucide="check"></i></button>
            <button class="iconbtn danger" data-act="rejectReq" data-req="${r.id}" title="رفض"><i data-lucide="x"></i></button>
          </div></div>`).join('')}` : ''}
      <div class="chat-sec"><i data-lucide="users"></i> محادثاتك وأصدقاؤك</div>
      ${peers.length ? peers.map(p => {
        const last = convMap[p];
        const un = chatMsgs.filter(m => m.from === p && m.to === u.email && !m.read).length;
        return `<div class="crow" data-peer="${esc(p)}">${avatarHTML(displayNameFor(p), 38)}
          <div class="fi"><div class="n">${esc(displayNameFor(p))}</div>
          <div class="p">${last ? esc((last.from === u.email ? 'أنت: ' : '') + (last.body || '').slice(0, 40)) : esc(p)}</div></div>
          ${un ? `<span class="bdg">${arNum(un)}</span>` : ''}</div>`;
      }).join('') : `<p style="padding:8px 16px;font-size:12.5px;color:var(--ink3);line-height:1.8">لسه مفيش محادثات — اكتب إيميل صاحبك فوق واضغط بحث.<br><b>مهم:</b> لازم يكون مسجل حساب على أرابكوا، والإيميل بحروف إنجليزية زي ما ظهر له وقت التسجيل.</p>`}
    </div>
    <div class="chat-main" id="chatMain"></div>
  </div>`;

  const renderThread = () => {
    const main = $('#chatMain'); if (!main) return;
    if (!chatUI.peer) {
      main.innerHTML = `<div class="chat-empty"><i data-lucide="message-circle"></i>
        <p>اختار محادثة من اليمين، أو دوّر على صاحبك بإيميله.<br>لو عايز تجرب لوحدك: اعمل حساب تاني من قائمة الحساب<br>وسجل دخول بيه وابعت لنفسك.</p></div>`;
      icons(); return;
    }
    const peerU = users.find(x => x.email === chatUI.peer);
    const msgs = chatMsgs.filter(m => (m.from === u.email && m.to === chatUI.peer) || (m.to === u.email && m.from === chatUI.peer)).sort((a,b) => new Date(a.date) - new Date(b.date));
    let changed = false;
    for (const m of msgs) if (m.to === u.email && !m.read) { m.read = true; changed = true; }
    if (changed) DB.set('arp_chat_msgs', chatMsgs);
    const isF = areFriends(u.email, chatUI.peer);
    main.innerHTML = `<div class="chat-head">
        <div class="uh" data-prof="${esc(chatUI.peer)}">${avatarHTML(peerU ? peerU.name : chatUI.peer, 38)}
        <div><div class="n">${esc(peerU ? peerU.name : chatUI.peer)}</div><div class="e">${esc(chatUI.peer)}</div></div></div>
        <div class="acts">
          ${!isF ? `<button class="iconbtn" data-act="addFriend" data-peer="${esc(chatUI.peer)}" title="إضافة صديق"><i data-lucide="user-plus"></i></button>` : `<span class="rtag">أصدقاء</span>`}
          <button class="iconbtn" data-act="callVideo" data-peer="${esc(chatUI.peer)}" title="مكالمة فيديو"><i data-lucide="video"></i></button>
          <button class="iconbtn" data-act="callAudio" data-peer="${esc(chatUI.peer)}" title="مكالمة صوتية"><i data-lucide="phone"></i></button>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs">
        ${msgs.length ? msgs.map(m => `<div class="msg ${m.from === u.email ? 'me' : 'them'}">${esc(m.body)}</div>`).join('')
          : `<div style="text-align:center;color:var(--ink3);font-size:12.5px;margin:auto">ابدأ المحادثة بسلام</div>`}
      </div>
      <div class="chat-input">
        <input id="chatIn" placeholder="اكتب رسالتك..." autocomplete="off">
        <button class="btn primary" id="chatSend" style="padding:10px 18px"><i data-lucide="send"></i></button>
      </div>`;
    icons();
    const box = $('#chatMsgs'); box.scrollTop = box.scrollHeight;
    $('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
    $('#chatSend').onclick = sendChat;
    main.querySelector('.uh').onclick = () => goProfile(chatUI.peer);
  };

  function sendChat(){
    const inp = $('#chatIn'); const body = (inp.value || '').trim(); if (!body) return;
    if (!users.some(x => x.email === chatUI.peer)) { toast('الحساب ده مش موجود', 'shield', true); return; }
    chatMsgs.push({id:uid(), from:u.email, to:chatUI.peer, body, date:nowISO(), read:false});
    const msgs = chatMsgs.filter(m => (m.from === u.email && m.to === chatUI.peer) || (m.to === u.email && m.from === chatUI.peer));
    for (const m of msgs) if (m.to === u.email) m.read = true;
    DB.set('arp_chat_msgs', chatMsgs);
    inp.value = '';
    renderThread(); icons();
  }

  renderThread();

  $('#chatFind').onclick = () => {
    const raw = ($('#chatQ').value || '').trim();
    chatUI.q = raw;
    chatUI.foundList = [];
    if (!raw) { toast('اكتب إيميل صاحبك (أو اسمه) الأول', 'search'); return renderChat(); }
    const id = raw.toLowerCase();
    let cands = [];
    const withDom = id.endsWith('@arpico.com') ? id : id + '@arpico.com';
    // 1) إيميل مطابق تمامًا
    cands = users.filter(x => (x.email||'').toLowerCase() === withDom || (x.email||'').toLowerCase() === id);
    // 2) إيميل بعد تطبيع عربي (همزات/تاء مربوطة)
    if (!cands.length) cands = users.filter(x => normAr((x.email||'').toLowerCase()) === normAr(withDom));
    // 3) بالاسم (بعد تطبيع) — لو اكتر من واحد ه نظهرهم كلهم
    if (!cands.length) {
      const nn = normAr(id).replace(/\s+/g, ' ').trim();
      cands = users.filter(x => normAr((x.name||'').toLowerCase()).replace(/\s+/g,' ').trim() === nn);
    }
    // 4) بالإيميل المتولد من الاسم (أي صيغة)
    if (!cands.length && !id.includes('@')) {
      const guesses = [translitSlug(raw), nameToSlug(raw)].filter(Boolean).map(s => s + '@arpico.com');
      cands = users.filter(x => guesses.includes((x.email||'').toLowerCase()));
    }
    if (!cands.length) {
      toast(`ما لقينش حد بالبحث ده "${raw}" — اتأكد إن الحساب مسجل فعلاً على أرابكوا`, 'shield', true);
      return renderChat();
    }
    chatUI.foundList = cands.map(c => c.email);
    renderChat(); icons();
  };
  $('#chatQ').addEventListener('keydown', e => { if (e.key === 'Enter') $('#chatFind').click(); });

  viewport.querySelectorAll('.crow').forEach(r => r.onclick = () => {
    chatUI.peer = r.dataset.peer;
    if (isNarrow()) openChatModal(chatUI.peer);
    else { renderChat(); icons(); }
  });
}

function openChatModal(peer){
  const u = me(); if (!u) return;
  peer = (peer || '').toLowerCase();
  const peerU = users.find(x => x.email === peer);
  const msgs = chatMsgs.filter(m => (m.from === u.email && m.to === peer) || (m.to === u.email && m.from === peer)).sort((a,b) => new Date(a.date) - new Date(b.date));
  for (const m of msgs) if (m.to === u.email) m.read = true;
  DB.set('arp_chat_msgs', chatMsgs);
  openModal(`<h3><i data-lucide="message-circle"></i><span style="flex:1">${esc(peerU ? peerU.name : peer)}</span>
      <button class="iconbtn" data-act="callVideo" data-peer="${esc(peer)}" title="مكالمة فيديو"><i data-lucide="video"></i></button></h3>
    <div style="max-height:45vh;overflow-y:auto;display:flex;flex-direction:column;margin-bottom:10px" id="cmBox">
      ${msgs.length ? msgs.map(m => `<div class="msg ${m.from === u.email ? 'me' : 'them'}">${esc(m.body)}</div>`).join('')

    </div>

// ---------- المكالمات (كاميرا وميكروفون حقيقيان) ----------
let callStream = null, callInts = [], callAudioCtx = null, callStart = 0;
async function openCall(peerEmail, withVideo){
  const u = me(); if (!u) return;
  peerEmail = (peerEmail || '').toLowerCase();
  if (!users.some(x => x.email === peerEmail)) { toast('الحساب ده مش موجود', 'shield', true); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('المتصفح مش داعم للمكالمات', 'mic', true); return; }
  try {
    callStream = await navigator.mediaDevices.getUserMedia({audio:true, video:withVideo});
  } catch(e) {
    toast(`اسمح بالوصول ${withVideo ? 'للكاميرا والميكروفون' : 'للميكروفون'} الأول من إعدادات المتصفح`, 'mic', true);
    return;
  }
  window._activeCall = true; callStart = Date.now();
  const peerU = users.find(x => x.email === peerEmail);
  openModal(`<div class="callbox">
    ${withVideo
      ? `<video id="callVid" autoplay playsinline muted></video>`
      : `<div class="callring">${avatarHTML(peerU ? peerU.name : peerEmail, 96)}</div>
         <canvas id="callMeter" width="220" height="10"></canvas>`}
    <div class="callname">${esc(peerU ? peerU.name : peerEmail)}</div>
    <div class="callsub">مكالمة ${withVideo ? 'فيديو' : 'صوتية'} — كاميرتك وميكروفونك شغالين فعلاً.<br>الربط المباشر بين جهازين محتاج سيرفر (النسخة دي محلية).</div>
    <div class="calltime" id="callTime">00:00</div>
    <div class="callacts">
      <button class="callbtn" id="callMute" title="كتم"><i data-lucide="mic"></i></button>
      <button class="callbtn end" id="callEnd" title="إنهاء"><i data-lucide="phone-off"></i></button>
    </div></div>`);
  if (withVideo) { const v = $('#callVid'); if (v) v.srcObject = callStream; }
  callInts.push(setInterval(() => {
    const s = Math.floor((Date.now() - callStart) / 1000);
    const el = $('#callTime');
    if (el) el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 500));
  if (!withVideo) {
    try {
      callAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = callAudioCtx.createMediaStreamSource(callStream);
      const an = callAudioCtx.createAnalyser(); an.fftSize = 256;
      src.connect(an);
      const data = new Uint8Array(an.frequencyBinCount);
      const cv = $('#callMeter');
      if (cv) {
        const ctx = cv.getContext('2d');
        callInts.push(setInterval(() => {
          an.getByteFrequencyData(data);
          const avg = data.reduce((a,b) => a+b, 0) / data.length;
          ctx.clearRect(0, 0, 220, 10);
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--brand') || '#B23A2E';
          const w = Math.max(6, (avg / 255) * 220);
          ctx.fillRect((220 - w) / 2, 2, w, 6);
        }, 100));
      }
    } catch(e){}
  }
  let muted = false;
  $('#callMute').onclick = () => {
    muted = !muted;
    callStream.getAudioTracks().forEach(t => t.enabled = !muted);
    $('#callMute').innerHTML = `<i data-lucide="${muted ? 'mic-off' : 'mic'}"></i>`; icons();
  };
  $('#callEnd').onclick = () => closeModal();
  icons();
}
function cleanupCall(){
  window._activeCall = false;
  callInts.forEach(clearInterval); callInts = [];
  if (callStream) { callStream.getTracks().forEach(t => t.stop()); callStream = null; }
  if (callAudioCtx) { try { callAudioCtx.close(); } catch(e){} callAudioCtx = null; }
}
